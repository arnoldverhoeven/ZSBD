# zsbd.be: statische webshop, producten en betalingen via de Shopzo API (api.shopzo.be).
[build]
  publish = "."

# Productfoto's die Jennifer via het Shopzo-dashboard oplaadt staan in Supabase Storage;
# zo kan de image-CDN van Netlify ze verkleinen.
[images]
  remote_images = ["https://jbzdingkkqbmpyhrloux\\.supabase\\.co/storage/v1/object/public/.*"]

# Oude pagina (de kaarsen hebben geen geur)
# Kerstpakketten en kerstdecoratie staan samen onder Kerst
[[redirects]]
  from = "/kerstpakketten.html"
  to = "/kerst.html"
  status = 301

[[redirects]]
  from = "/geurkaarsen.html"
  to = "/kaarsen.html"
  status = 301

[[redirects]]
  from = "https://www.zsbd.be/*"
  to = "https://zsbd.be/:splat"
  status = 301
  force = true

# Beveiligingsheaders voor de hele site.
# CSP: alles van zsbd.be zelf; de Shopzo API (api.shopzo.be) voor producten en afrekenen;
# productfoto's uit het Shopzo-dashboard komen uit Supabase Storage. Inline <style>-attributen
# worden nog gebruikt, daarom 'unsafe-inline' enkel voor style-src. De JSON-LD-blokken zijn
# data (application/ld+json) en vallen niet onder script-src.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://jbzdingkkqbmpyhrloux.supabase.co; font-src 'self'; connect-src 'self' https://api.shopzo.be; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
